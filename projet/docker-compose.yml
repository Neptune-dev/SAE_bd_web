services:
  web:
    image: paliari/apache-php8-oci8:1.2.0-dev
    container_name: apache_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public_html:/var/www/html/public
    depends_on:
      - oracle_db

  oracle_db:
    image: gvenzl/oracle-free:latest
    container_name: oracle_db
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: "SysPassw0rd!"
      APP_USER: "oracle_user"
      APP_USER_PASSWORD: "oracle_pwd"
      ORACLE_ALLOW_REMOTE: true
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./bd.sql:/container-entrypoint-initdb.d/init.sql:ro
      - ./oracle_data:/opt/oracle/oradata

  adminer:
    build: .
    restart: unless-stopped
    container_name: adminer
    environment:
      ADMINER_DEFAULT_SERVER: oracle_db
      ADMINER_USER: oracle_user
      ADMINER_PASSWORD: oracle_pwd
    ports:
      - 8081:8080
    depends_on:
      - oracle_db
