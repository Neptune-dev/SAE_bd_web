services:
  web:
    image: paliari/apache-php8-oci8:1.2.0-dev
    container_name: web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public_html:/var/www/html/public
    depends_on:
      - oracle_db

  oracle_db:
    image: gvenzl/oracle-free:latest
    container_name: oracle_db
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: "SysPassw0rd!"
      APP_USER: "oracle_user"
      APP_USER_PASSWORD: "oracle_pwd"
      ORACLE_ALLOW_REMOTE: true
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    volumes:
#      - ./docker/docker_bd.sql:/container-entrypoint-initdb.d/init.sql:ro
      - oracle_data:/opt/oracle/oradata

  adminer:
    build:
      dockerfile: ./docker/Dockerfile
      context: .
    restart: unless-stopped
    container_name: adminer
    environment:
      ADMINER_DEFAULT_SERVER: oracle_db:1521/FREEPDB1
      ADMINER_USER: oracle_user
      ADMINER_PASSWORD: oracle_pwd
    ports:
      - 8081:8080
    depends_on:
      - oracle_db
volumes:
  oracle_data: